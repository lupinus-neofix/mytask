<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Myタスク</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Myタスク">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
:root {
  --page: #ffffff; --card: #ffffff; --ink: #2b2a28; --sub: #6f6d68; --muted: #a3a19b;
  --line: #ebe8e3; --line-strong: #d6d2cb; --danger: #c43d3d; --danger-bg: #fdecec;
  --warn: #9a6a0c; --warn-bg: #fdf3dc; --overlay: rgba(30, 28, 25, .38); --shadow: 0 1px 2px rgba(0,0,0,.04);
  --cancel: #b0306e; --cancel-bg: #fde7f1;
  --safe-top: env(safe-area-inset-top, 0px);
}
[data-col="now"]     { --c-bg: #fcf3f6; --c-pill: #f7d9e3; --c-ink: #8e3a57; --c-add: #c2547a; }
[data-col="next"]    { --c-bg: #fcf8ea; --c-pill: #f6e6b4; --c-ink: #7a5a10; --c-add: #b0830f; }
[data-col="someday"] { --c-bg: #eef5fc; --c-pill: #d5e6f8; --c-ink: #2b5d8c; --c-add: #3f82c4; }
[data-col="plan"]    { --c-bg: #f6f2fc; --c-pill: #e7dbf6; --c-ink: #5f3f8c; --c-add: #9a6fd0; }
[data-col="cal"]     { --c-bg: #eef6f0; --c-pill: #d5ebdc; --c-ink: #2f6b45; --c-add: #3f8f5c; }
@media (prefers-color-scheme: dark) {
  :root {
    --page: #1c1b1a; --card: #2a2927; --ink: #ecebe8; --sub: #b3b0aa; --muted: #85827c;
    --line: #3a3835; --line-strong: #4d4a46; --danger: #f08a8a; --danger-bg: #3d2222;
    --warn: #f0c46a; --warn-bg: #3a3020; --overlay: rgba(0,0,0,.55); --shadow: none;
    --cancel: #f39ac4; --cancel-bg: #3d2230;
  }
  [data-col="now"]     { --c-bg: #2b2226; --c-pill: #5a2f40; --c-ink: #f5c7d7; --c-add: #e98fb0; }
  [data-col="next"]    { --c-bg: #2a271d; --c-pill: #5a4a1c; --c-ink: #f3dc9a; --c-add: #e2bd55; }
  [data-col="someday"] { --c-bg: #1f2630; --c-pill: #24456a; --c-ink: #c4dcf5; --c-add: #7fb2e6; }
  [data-col="plan"]    { --c-bg: #26222e; --c-pill: #46345f; --c-ink: #ddcdf3; --c-add: #b99be3; }
  [data-col="cal"]     { --c-bg: #1f2a23; --c-pill: #2b4433; --c-ink: #b9e2c4; --c-add: #7cc596; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); overscroll-behavior: none; }   /* 上に引っぱっても画面が下がらないように */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--ink); }
[hidden] { display: none !important; }

.top { position: sticky; top: 0; z-index: 5; background: var(--page); display: flex; align-items: center; gap: 8px; padding: calc(14px + var(--safe-top)) 16px 10px; }
.top h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; }
.title-btn { font-size: 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; padding: 4px 6px; margin-left: -6px; border-radius: 8px; }
.title-btn:active { background: var(--line); }
.title-btn svg { width: 16px; height: 16px; color: var(--muted); }
html.space-private, body.space-private { --page: #f3f6f1; }
body.space-private .title-btn { color: #2f6b45; }
body.space-private .col[data-col="plan"] { display: none !important; }
body:not(.space-private) .col[data-col="cal"] { display: none !important; }
/* カレンダー（プライベート） */
.cal-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.cal-nav .icon-btn { color: var(--c-ink); }
.cal-title { flex: 1; text-align: center; font-weight: 600; font-size: 15px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.cal-wd { font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0 4px; }
.cal-wd.sun, .cal-day.sun .n { color: #c0504d; }
.cal-wd.sat, .cal-day.sat .n { color: #3f72b0; }
.cal-day { min-height: 46px; border-radius: 8px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; }
.cal-day.other { opacity: .35; }
.cal-day.today .n { background: var(--c-add); color: #fff !important; border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; }
.cal-day.sel { background: var(--c-pill); }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-add); }
.cal-dot.task { background: transparent; border: 1.5px solid var(--c-add); }
.cal-list { margin-top: 12px; }
.cal-list-head { font-size: 14px; font-weight: 600; color: var(--c-ink); margin: 0 2px 6px; }
.cal-item { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; font-size: 14px; }
.cal-item .t { font-variant-numeric: tabular-nums; color: var(--c-ink); font-weight: 600; min-width: 42px; }
.cal-item .ttl { flex: 1; word-break: break-word; }
.cal-item .sub { font-size: 12px; color: var(--sub); }
.cal-item.pending { opacity: .55; }
.cal-tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--c-add); color: var(--c-ink); white-space: nowrap; }
@media (prefers-color-scheme: dark) { html.space-private, body.space-private { --page: #1b221d; } body.space-private .title-btn { color: #9fd3ad; } }
.space-tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #d9ecdf; color: #2f6b45; margin-left: 6px; }
@media (prefers-color-scheme: dark) { .space-tag { background: #2b4433; color: #b9e2c4; } }
.monthly-sec { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 12px; }
.monthly-sec h4 { font-size: 14px; margin: 0 0 4px; }
.monthly-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.monthly-row input { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; font-size: 14px; padding: 6px 8px; border-radius: 8px; }
.monthly-row input:focus { border-color: var(--line-strong); background: var(--card); outline: none; }
.day-select { font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); }
.monthly-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.monthly-tag { display: inline-flex; align-items: center; gap: 2px; }
.trash-account { border-top: 1px solid var(--line); margin-top: 28px; padding-top: 12px; font-size: 12px; color: var(--muted); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; word-break: break-all; white-space: pre-line; }
.trash-account button { font-size: 13px; color: var(--sub); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-strong); white-space: nowrap; }
.status { font-size: 12px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--sub); }
.icon-btn:active { background: var(--line); }
.icon-btn svg { width: 22px; height: 22px; }
.hist svg { width: 26px; height: 26px; }
.hist .arc-out { fill: none; stroke: #1b5bb0; stroke-width: 5; stroke-linecap: round; }
.hist .arc-in { fill: none; stroke: #4a8fe8; stroke-width: 3; stroke-linecap: round; }
.hist .head { fill: #4a8fe8; stroke: #1b5bb0; stroke-width: 1.1; stroke-linejoin: round; }
.hist.off { opacity: .3; filter: grayscale(1); }

.tabs { position: sticky; top: calc(60px + var(--safe-top)); z-index: 4; background: var(--page); display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; padding: 7px 12px; border-radius: 10px; background: var(--c-pill); color: var(--c-ink); font-size: 14px; font-weight: 600; white-space: nowrap; border: 2px solid transparent; opacity: .55; }
.tab.active { opacity: 1; border-color: var(--c-ink); }
.tab .n { font-weight: 400; margin-left: 4px; }
.tabs.dragging .tab { opacity: 1; border-style: dashed; border-color: var(--c-ink); transition: transform .12s; }
.tabs.dragging .tab.active { border-style: solid; }
.tabs.dragging { overflow: visible; z-index: 100002; }   /* 持ち上げたカードより手前に出して、大きくなったタブを見せる */
.tabs.dragging .tab.drop-over { background: var(--c-ink); color: var(--c-pill); border-style: solid; transform: scale(1.25); box-shadow: 0 6px 16px rgba(0,0,0,.18); position: relative; z-index: 1; }
.tabs.dragging .tab[data-col="plan"], .tabs.dragging .tab[data-col="cal"] { opacity: .3; border-style: solid; border-color: transparent; }

.board { padding: 0 16px 120px; }
.col { display: none; background: var(--c-bg); border-radius: 16px; padding: 12px; }
.col.active { display: block; }
.col-head { display: none; align-items: center; gap: 8px; margin: 2px 2px 12px; }
.pill { background: var(--c-pill); color: var(--c-ink); font-weight: 600; font-size: 14px; padding: 3px 10px; border-radius: 8px; }
.col-head .n { color: var(--muted); font-size: 13px; }
.list { min-height: 12px; }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 0 10px; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: opacity .25s;
}
.card.pending { opacity: .6; }
.card.leaving { opacity: 0; }
.card.leaving .title { text-decoration: line-through; }
.chk { flex: none; width: 22px; height: 22px; margin-top: 1px; border: 1.5px solid var(--line-strong); border-radius: 6px; display: grid; place-items: center; }
.chk svg { width: 14px; height: 14px; opacity: 0; }
.chk.on { background: var(--c-add); border-color: var(--c-add); color: #fff; }
.chk.on svg { opacity: 1; }
.card.pinned { border: 1.5px solid var(--c-add); background: color-mix(in srgb, var(--c-pill) 35%, var(--card)); }
.pin-mark { flex: none; width: 22px; height: 22px; margin-top: 1px; color: var(--c-add); display: grid; place-items: center; }
.pin-mark svg { width: 18px; height: 18px; }
.btn.pin { flex: 0 0 auto; }
.btn.pin.on { background: var(--c-pill, #eee); border-color: var(--c-add, #999); color: var(--c-ink, inherit); }
.body { flex: 1; min-width: 0; }
.title { font-size: 15px; font-weight: 500; word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--sub); align-items: center; }
.due { padding: 1px 7px; border-radius: 6px; background: var(--line); }
.due.over { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
.due.today { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.memo-mark { display: inline-flex; align-items: center; gap: 2px; }
.memo-mark svg { width: 14px; height: 14px; }
.sortable-ghost { opacity: .35; }
.sortable-chosen { box-shadow: 0 6px 18px rgba(0,0,0,.12); }

.add { width: 100%; text-align: left; color: var(--c-add); font-weight: 500; padding: 10px 14px; border-radius: 12px; border: 1px dashed transparent; }
.add:active { background: var(--card); }
.add-form { display: none; gap: 8px; }
.add-form.open { display: flex; }
.add-form input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); font-size: 16px; }
.add-form button { padding: 0 14px; border-radius: 10px; background: var(--c-add); color: #fff; font-weight: 600; }

/* 予定 */
.plan-nav { display: flex; align-items: center; gap: 4px; margin: 0 0 4px; }
.plan-nav .icon-btn { color: var(--c-ink); }
.plan-date { flex: 1; text-align: center; font-weight: 600; font-size: 15px; }
.plan-date small { font-weight: 400; color: var(--sub); font-size: 12px; margin-left: 4px; }
.plan-today { font-size: 12px; color: var(--c-ink); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--c-pill); }
.plan-sub { text-align: center; font-size: 12px; color: var(--sub); margin-bottom: 10px; min-height: 18px; }
.plan-site { margin-top: 6px; }
.plan-site + .plan-site { margin-top: 16px; }
.site-head { font-size: 13px; font-weight: 600; color: var(--c-ink); margin: 0 2px 6px; }
.site-head span { font-weight: 400; color: var(--sub); }
.banner { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--sub); text-align: center; margin: 8px 0; }
.tl { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; }
.tl-row { display: grid; grid-template-columns: 44px 1fr; gap: 6px; min-height: 30px; border-top: 1px solid var(--line); align-items: start; }
.tl-row:first-child { border-top: 0; }
.tl-time { font-size: 12px; color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.tl-row.has .tl-time { color: var(--c-ink); font-weight: 600; }
.visit { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; margin: 3px 0; padding: 6px 10px; border-radius: 9px; background: var(--c-pill); color: var(--c-ink); font-size: 14px; font-weight: 500; }
.visit .vname { flex: 1; min-width: 0; word-break: break-word; }
.visit .vicon { display: inline-flex; gap: 4px; opacity: .85; }
.visit .vicon svg { width: 15px; height: 15px; }
.visit.cancel { background: var(--cancel-bg); color: var(--cancel); }
.visit.cancel .vname { text-decoration: line-through; }
.visit .tag { font-size: 11px; font-weight: 600; }
.plan-foot { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; }
.visit { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.visit.lifted { opacity: .3; }
.visit.ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; box-shadow: 0 10px 24px rgba(0,0,0,.2); transform-origin: center; }
.tl.dragging .tl-row { transition: background .1s; }
.tl.dragging .tl-row.drop-ok { background: var(--c-pill); border-radius: 8px; }
.tl.dragging .tl-row.drop-ok .tl-time { color: var(--c-ink); font-weight: 700; }
.tl.dragging .tl-row.drop-ng { background: var(--danger-bg); border-radius: 8px; }
.visit.moving { opacity: .55; }
.v-block { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 6px; font-size: 14px; background: var(--card); white-space: pre-wrap; word-break: break-word; }
.v-block .who { font-size: 12px; color: var(--sub); margin-top: 4px; white-space: normal; }
.v-block .reply { font-size: 13px; color: var(--sub); border-left: 2px solid var(--line-strong); padding-left: 8px; margin-top: 6px; }
.v-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); font-size: 14px; background: var(--card); }
.chip.danger { color: var(--danger); }
.chip.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.chip.main { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }
.chip:disabled { opacity: .5; }
.v-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
.v-row .v-block { flex: 1; margin-top: 0; }
.v-row .chip { flex: none; padding: 6px 10px; font-size: 13px; }
.v-input { width: 100%; margin-top: 6px; }
.tl-add { font-size: 13px; color: var(--muted); padding-top: 5px; display: block; }
.tl-row.addable { cursor: pointer; }
.tl-row.addable:active { background: var(--c-pill); border-radius: 8px; }
.trash-all { font-size: 13px; color: var(--danger); padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; }
.trash-all.armed { background: var(--danger); color: #fff; }
.v-cancel { background: var(--cancel-bg); color: var(--cancel); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; margin-top: 10px; }

.menu { position: absolute; left: 12px; top: calc(52px + var(--safe-top)); z-index: 20; min-width: 240px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 6px; display: none; }
.menu.open { display: block; }
.menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; }
.menu button:active { background: var(--line); }
.menu .foot { border-top: 1px solid var(--line); margin-top: 6px; padding: 8px 12px 4px; font-size: 12px; color: var(--muted); word-break: break-all; white-space: pre-line; }

.overlay { position: fixed; inset: 0; z-index: 30; background: var(--overlay); display: none; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.sheet { background: var(--page); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 12px 18px calc(24px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; align-items: center; gap: 8px; margin: 0 -6px 6px; }
.sheet-head .grow { flex: 1; font-size: 13px; color: var(--muted); text-align: right; padding-right: 6px; }
.f-title { width: 100%; border: 0; background: none; resize: none; font-size: 19px; font-weight: 600; padding: 4px 0; outline: none; overflow: hidden; }
.label { font-size: 12px; color: var(--sub); margin: 16px 0 6px; }
.cols { display: flex; flex-wrap: wrap; gap: 6px; }
.cols button { padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 14px; }
.cols button.on { background: var(--c-pill); color: var(--c-ink); border-color: var(--c-ink); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; }
.field { border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); padding: 9px 12px; font-size: 16px; }
.f-due { flex: 1; min-width: 0; min-height: 42px; }
.ghost { padding: 9px 12px; border-radius: 10px; color: var(--sub); font-size: 14px; }
.f-memo { width: 100%; min-height: 120px; resize: vertical; line-height: 1.6; }
.counter { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
.memo-head { display: flex; align-items: center; justify-content: space-between; }
.memo-full-btn { font-size: 12px; color: var(--sub); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line-strong); }
#detail.memo-full .f-memo[readonly] { background: var(--page); border-color: transparent; padding-left: 2px; }
.memo-title { display: none; font-size: 15px; font-weight: 600; margin: 0 0 8px; word-break: break-word; }
/* メモを全画面で読む・書く */
#detail.memo-full { align-items: stretch; }
#detail.memo-full .sheet { max-width: none; width: 100%; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; display: flex; flex-direction: column;
  padding-top: calc(12px + var(--safe-top)); }
#detail.memo-full .sheet > *:not(.memo-zone) { display: none; }
#detail.memo-full .memo-zone { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#detail.memo-full .memo-title { display: block; }
#detail.memo-full .memo-head { margin-top: 0; }
#detail.memo-full .f-memo { flex: 1; min-height: 0; resize: none; font-size: 16px; line-height: 1.8; }
.actions { display: flex; gap: 8px; margin-top: 20px; }
.btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line-strong); font-weight: 600; text-align: center; }
.btn.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
.btn.danger { flex: 0 0 auto; color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }

/* ゴミ箱 */
.trash-day { font-size: 12px; font-weight: 600; color: var(--sub); margin: 16px 2px 4px; }
.trash-item { display: flex; gap: 8px; align-items: center; padding: 10px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
var CONFIG = window.MT_CONFIG || {};
var COLS = [
  { id: 'now', name: '今すぐやる', short: '今すぐ' },
  { id: 'next', name: '次にやる', short: '次に' },
  { id: 'someday', name: 'いつかやる', short: 'いつか' }
];
var PLAN = { id: 'plan', name: '予定', short: '予定' };
var TABS = COLS.concat([PLAN]);
var CAL = { id: 'cal', name: 'カレンダー', short: 'カレンダー' };
var PRIVATE_TABS = COLS.concat([CAL]);
/** 表示中のタブ（プライベートには予定タブが無い） */
function currentTabs() { return state.space === 'private' ? PRIVATE_TABS : TABS; }
function inSpace(t) { return (t.space || 'work') === state.space; }
var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var MEMO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>';
var PIN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.6 2.6l6.8 6.8-1.6 1.1-2.2-.4-3.4 3.4.6 4.3-1.6 1.6-3.6-3.6-5.3 5.3-1.4-1.4 5.3-5.3-3.6-3.6 1.6-1.6 4.3.6 3.4-3.4-.4-2.2z"/></svg>';
var PIN_MAX = 3;   // 1つの列にピン留めできる数
var COMMENT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>';
var CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
var CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

var state = { tasks: [], me: null, keepDays: 183, active: 'now', space: 'work' };
var plan = { date: '', data: null, comments: null, loading: false, error: '', commentsLoading: false };
var dragging = false;
var idMap = {};          // 仮ID → 保存後の本当のID
var queue = Promise.resolve();
var pendingCount = 0;
var mobileMq = window.matchMedia('(max-width: 699px)');
var started = false;

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function storeJson(k, v) {
  if (v === undefined) { try { return JSON.parse(store(k) || 'null'); } catch (e) { return null; } }
  store(k, v === null ? null : JSON.stringify(v));
}

// ---- サーバー呼び出し ----
// 読むだけの問い合わせは、Googleの一時的なエラーページが返ってきたら1回だけやり直す（書き込みは二重にならないようやり直さない）
var API_SAFE_RETRY = { login: 1, board: 1, schedule: 1, comments: 1, config: 1 };
function api(action, args, retried) {
  if (!CONFIG.apiUrl) return Promise.reject(new Error('管理者の設定（config.js の apiUrl）がまだです'));
  return fetch(CONFIG.apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // text/plain にすると事前確認（CORS）が要らない
    body: JSON.stringify({ action: action, token: store('mt_token') || '', args: args || {} }),
    redirect: 'follow'
  }).then(function (r) {
    return r.text().then(function (text) {
      try { return JSON.parse(text); } catch (e) {
        var err = new Error('受付の応答が読めませんでした（' + r.status + ' ' + apiHint(text) + '）。少し時間をおいて、もう一度お試しください');
        err.code = 'bad_response';
        throw err;
      }
    });
  }, function () {
    throw new Error('通信できませんでした。電波の良いところで、もう一度お試しください');
  }).then(function (res) {
    if (res.ok) return res.data;
    var err = new Error(res.error || 'エラーが起きました');
    err.code = res.code;
    if (res.code === 'auth' || res.code === 'not_registered') authLost(err);
    throw err;
  }).catch(function (err) {
    if (err.code === 'bad_response' && !retried && API_SAFE_RETRY[action]) {
      return new Promise(function (ok) { setTimeout(ok, 1200); }).then(function () { return api(action, args, true); });
    }
    throw err;
  });
}
/** JSONでない応答（Googleのエラーページなど）から、原因の手がかりになる短い文字を取り出す */
function apiHint(text) {
  var t = String(text || '');
  var title = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(t);
  var s = (title ? title[1] : t.replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim();
  return s.slice(0, 60) || '空の応答';
}
function realId(id) { return idMap[id] || id; }
function enqueue(thunk) {
  pendingCount++;
  setStatus();
  var p = queue.then(thunk);
  queue = p.catch(function () {}).then(function () { pendingCount--; setStatus(); });
  return p.catch(function (err) {
    if (err.code !== 'auth' && err.code !== 'not_registered') {
      toast((err && err.message) || '保存に失敗しました');
      load();
    }
    throw err;
  });
}
function setStatus() { $('status').textContent = pendingCount > 0 ? '保存中…' : ''; }

// ---- ログイン ----
function showLogin(message, isError) {
  $('topBar').hidden = true;
  $('quickAdd').hidden = true;
  $('tabs').hidden = true;
  $('board').hidden = true;
  $('board').innerHTML = '';
  $('login').hidden = false;
  var msg = $('loginMsg');
  msg.hidden = !message;
  msg.textContent = message || '';
  msg.className = 'msg' + (isError ? ' err' : '');
  loadGis().then(function () {
    var clientId = CONFIG.clientId;
    if (!clientId) { showLoginError('管理者の設定（config.js の clientId）がまだです'); return; }
    google.accounts.id.initialize({ client_id: clientId, callback: onCredential, ux_mode: 'popup', itp_support: true });
    $('gbtn').innerHTML = '';
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ja', width: 280 });
  }).catch(function () {
    showLoginError('ログインの準備ができませんでした。電波の良いところで開き直してください');
  });
}
function showLoginError(text) {
  var msg = $('loginMsg');
  msg.hidden = false;
  msg.className = 'msg err';
  msg.textContent = text;
}
var gisPromise = null;
function loadGis() {
  if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
  if (gisPromise) return gisPromise;
  gisPromise = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = resolve;
    s.onerror = function () { gisPromise = null; reject(); };
    document.head.appendChild(s);
  });
  return gisPromise;
}
function onCredential(resp) {
  var msg = $('loginMsg');
  msg.hidden = false;
  msg.className = 'msg';
  msg.textContent = '確認しています…';
  api('login', { idToken: resp.credential }).then(function (res) {
    store('mt_token', res.token);
    storeJson('mt_me', res.me);
    state.me = res.me;
    startApp();
  }).catch(function (err) {
    showLoginError(err.message);
  });
}
function authLost(err) {
  store('mt_token', null);
  storeJson('mt_board', null);
  showLogin(err.message, true);
}
function logout() {
  var token = store('mt_token');
  if (token) api('logout').catch(function () {});
  store('mt_token', null);
  storeJson('mt_board', null);
  storeJson('mt_me', null);
  clearPlanCache();
  state.tasks = [];
  undoStack = []; redoStack = [];
  try { google.accounts.id.disableAutoSelect(); } catch (e) { /* 読み込み前 */ }
  showLogin('ログアウトしました');
}

// ---- 起動 ----
function startApp() {
  $('login').hidden = true;
  $('topBar').hidden = false;
  $('quickAdd').hidden = false;
  renderQuickCols();
  $('tabs').hidden = false;
  $('board').hidden = false;
  updateHistoryButtons();
  var cached = storeJson('mt_board');
  if (!$('board').querySelector('.col')) $('board').innerHTML = '<div class="loading">読み込み中…</div>';
  if (cached && cached.tasks) {
    state.tasks = cached.tasks;
    state.keepDays = cached.keepDays || 183;
    render();
  }
  started = true;
  load();
  if (state.space === 'private') loadCal(cal.month);
  if (!plan.date) plan.date = ymd(new Date());
  if (state.active === 'plan' || !mobileMq.matches) loadPlan(plan.date);
}

// ---- 読み込み ----
function load() {
  return api('board').then(function (res) {
    state.tasks = res.tasks || [];
    state.me = res.me || state.me;
    state.keepDays = res.keepDays || 183;
    state.monthly = res.monthly || [];
    storeJson('mt_me', state.me);
    saveBoardCache();
    render();
  }).catch(function (err) {
    if (err.code === 'auth' || err.code === 'not_registered') return;
    if (state.tasks.length || storeJson('mt_board')) { toast(err.message); return; }
    $('board').innerHTML = '';
    $('board').appendChild(el('div', 'error-box', '読み込めませんでした。' + ((err && err.message) || '')));
  });
}
function saveBoardCache() {

  storeJson('mt_board', { tasks: state.tasks.filter(function (t) { return String(t.id).indexOf('tmp_') !== 0; }), keepDays: state.keepDays });
}

// ---- 描画 ----
function activeTasks(col) {

    };
    input.addEventListener('compositionstart', function () { composing = true; });
    input.addEventListener('compositionend', function () {

    });

// ---- 日付 ----
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function fmtMd(s) {
  var d = parseYmd(s);
  return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'.charAt(d.getDay()) + '）';
}
function dueInfo(s) {
  var today = new Date();
  var t = ymd(today);
  var tm = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  if (s < t) return { cls: 'over', text: '期限切れ ' + fmtMd(s) };
  if (s === t) return { cls: 'today', text: '今日まで' };
  if (s === ymd(tm)) return { cls: '', text: '明日まで' };
  return { cls: '', text: fmtMd(s) + 'まで' };
}
function relDay(s) {
  var t = ymd(new Date());
  if (s === t) return '今日';
  if (s === addDays(t, 1)) return '明日';
  if (s === addDays(t, -1)) return '昨日';
  return '';
}

// ---- 操作 ----
/** 仕事 ⇄ プライベート。見た目と列の中身が切り替わる（データは同じスプレッドシート） */
function setSpace(space) {
  state.space = space === 'private' ? 'private' : 'work';
  store('mt_space', state.space);
  applySpaceLook();
  if (state.space === 'private' && state.active === 'plan') state.active = 'now';
  if (state.space === 'work' && state.active === 'cal') state.active = 'now';
  if (state.space === 'private') loadCal(cal.month);
  render();
  if ($('trashPanel').classList.contains('open')) renderTrash();
  toast(state.space === 'private' ? 'プライベートに切り替えました' : '仕事のタスクに切り替えました');
}
function applySpaceLook() {
  var priv = state.space === 'private';
  document.body.classList.toggle('space-private', priv);
  document.documentElement.classList.toggle('space-private', priv);   // 画面の下まで色を付ける
  $('titleText').textContent = priv ? 'プライベート' : 'Myタスク';
  var meta = document.querySelector('meta[name="theme-color"]');

}
function setActive(col) {

  store('mt_active', col);
  render();

  if (col === 'plan') {
    if (!plan.date) plan.date = ymd(new Date());

  }
}
function openAdd(col) {
  if (mobileMq.matches && state.active !== col) setActive(col);
  var c = document.querySelector('.col[data-col="' + col + '"]');
  c.querySelector('.add').style.display = 'none';
  c.querySelector('.add-form').classList.add('open');
  c.querySelector('.add-form input').focus();
}
/** 空のまま欄の外を触ったら、開いている入力欄を閉じる */
function closeAddIfOutside(e) {
  Array.prototype.forEach.call(document.querySelectorAll('.add-form.open'), function (form) {
    var col = form.closest('.col');
    if (form.contains(e.target) || col.querySelector('.add').contains(e.target)) return;
    if (e.target.closest && e.target.closest('#addTop')) return;
    if (form.querySelector('input').value.trim()) return;
    closeAdd(col.dataset.col);
  });
}
document.addEventListener('touchstart', closeAddIfOutside, { capture: true, passive: true });
document.addEventListener('mousedown', closeAddIfOutside, true);
function closeAdd(col) {
  var c = document.querySelector('.col[data-col="' + col + '"]');
  c.querySelector('.add').style.display = '';
  c.querySelector('.add-form').classList.remove('open');
}
function addTask(col, title, fromQuick, memo) {
  memo = String(memo || '').slice(0, 2000);
  var tmp = {
    id: 'tmp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    title: title, col: col, ord: activeTasks(col).length ? activeTasks(col).slice(-1)[0].ord + 1 : 0,
    due: '', memo: memo, created: new Date().toISOString(), done: null, space: state.space
  };
  record('追加');
  state.tasks.push(tmp);
  render();
  if (!fromQuick) reopenAdd(col);   // 下の入力欄から足したときは、列の「＋新規」は開かない
  var tmpId = tmp.id;
  var space = state.space;
  enqueue(function () { return api('add', { col: col, title: title, space: space }); }).then(function (saved) {
    idMap[tmpId] = saved.id;
    var local = findTask(tmpId);
    if (local) local.id = saved.id;
    var card = document.querySelector('.card[data-id="' + tmpId + '"]');
    if (card) { card.dataset.id = saved.id; card.classList.remove('pending'); }
    saveBoardCache();
    // メモ付きで足したときは、本当のIDが決まってからメモを保存する（受付の「追加」はタイトルだけ受け取るため）
    if (memo) enqueue(function () { return api('update', { id: saved.id, patch: { memo: memo } }); });
  });
}
function reopenAdd(col) {
  var c = document.querySelector('.col[data-col="' + col + '"]');
  c.querySelector('.add').style.display = 'none';
  c.querySelector('.add-form').classList.add('open');
}
function findTask(id) {
  for (var i = 0; i < state.tasks.length; i++) {
    if (state.tasks[i].id === id || state.tasks[i].id === realId(id)) return state.tasks[i];
  }
  return null;
}
function onDrop(col, listEl) {
  var ids = Array.prototype.map.call(listEl.querySelectorAll('.card'), function (c) { return c.dataset.id; });
  var isPinned = function (id) { var t = findTask(id); return !!(t && t.pinned); };
  ids = ids.filter(isPinned).concat(ids.filter(function (id) { return !isPinned(id); }));   // ピン留めはいつも上
  var moving = ids.filter(function (id) { var t = findTask(id); return t && t.pinned && t.col !== col; });
  if (moving.length && pinCount(col) + moving.length > PIN_MAX) {
    toast('「' + colName(col) + '」はピン留めが' + PIN_MAX + 'つあります');
    render();
    return;
  }
  var prev = activeTasks(col).map(function (t) { return t.id; });
  if (ids.join() === prev.join()) { render(); return; }
  record(ids.length > prev.length ? '移動' : '並べ替え');
  ids.forEach(function (id, i) {
    var t = findTask(id);
    if (t) { t.col = col; t.ord = i; }
  });
  render();
  enqueue(function () { return api('reorder', { col: col, ids: ids.map(realId) }); });
}
function pinCount(col, exceptId) {
  return state.tasks.filter(function (t) { return t.id !== exceptId && t.col === col && t.pinned && !t.done && !t.deleted && inSpace(t); }).length;
}
function moveToCol(id, col) {
  var t = findTask(id);
  if (!t || t.col === col || col === 'plan') { render(); return; }
  if (t.pinned && pinCount(col, t.id) >= PIN_MAX) { toast('「' + colName(col) + '」はピン留めが' + PIN_MAX + 'つあります'); render(); return; }
  record('移動');
  var others = activeTasks(col);
  t.ord = others.length ? others.slice(-1)[0].ord + 1 : 0;
  t.col = col;
  render();
  toast('「' + colName(col) + '」へ移しました');
  enqueue(function () { return api('update', { id: realId(t.id), patch: { col: col } }); });
}
function colName(id) {
  for (var i = 0; i < COLS.length; i++) if (COLS[i].id === id) return COLS[i].name;
  return id;
}
function completeFromCard(id, card, chk) {
  chk.classList.add('on');
  card.classList.add('leaving');
  setTimeout(function () { setDone(id, true); }, 280);
}
function setDone(id, done) {
  var t = findTask(id);
  if (!t || !!t.done === !!done) return;
  if (done && t.pinned) { toast('ピン留めしたカードは完了にできません'); render(); return; }
  record(done ? '完了' : '完了の取り消し');
  t.done = done ? new Date().toISOString() : null;
  if (!done) t.ord = activeTasks(t.col).length ? activeTasks(t.col).slice(-1)[0].ord + 1 : 0;
  render();
  enqueue(function () { return api('setDone', { id: realId(t.id), done: done }); });
}
/** 削除：ゴミ箱へ入れる（30日で自動で消える） */
function deleteTask(id) {
  var t = findTask(id);
  if (!t || t.deleted) return;
  record('削除');
  t.deleted = new Date().toISOString();
  render();
  if ($('trashPanel').classList.contains('open')) renderTrash();
  toast('ゴミ箱に移しました', '元に戻す', function () { restoreTask(t.id, null); });
  enqueue(function () { return api('delete', { id: realId(t.id) }); });
}
/** ゴミ箱から戻す。col が無ければ元の列へ。どちらも列の一番下に入る */
function restoreTask(id, col) {
  var t = findTask(id);
  if (!t || (!t.done && !t.deleted)) return;
  var to = col || t.col;
  record('戻す');
  t.done = null;
  t.deleted = null;
  var others = activeTasks(to);
  t.ord = others.length ? others.slice(-1)[0].ord + 1 : 0;
  t.col = to;
  render();
  if ($('trashPanel').classList.contains('open')) renderTrash();
  toast('「' + colName(to) + '」に戻しました');
  enqueue(function () { return api('restore', { id: realId(t.id), col: to }); });
}
/** ゴミ箱で「すべて削除」（2回押し。すぐなら↶で戻せる） */
function purgeAllTrash() {
  var items = trashTasks();
  if (!items.length) return;
  record('すべて削除');
  state.tasks = state.tasks.filter(function (t) { return !t.done && !t.deleted; });
  render();
  renderTrash();
  toast(items.length + '件を完全に削除しました', '元に戻す', undo);
  enqueue(function () { return api('purgeAll'); });
}
/** ゴミ箱で「完全に削除」 */
function purgeTask(id) {
  var t = findTask(id);
  if (!t) return;
  record('完全に削除');
  state.tasks = state.tasks.filter(function (x) { return x !== t; });
  render();
  renderTrash();
  enqueue(function () { return api('purge', { id: realId(id) }); });
}

// ---- 元に戻す／やり直す（ページを開いている間、直近20回） ----
var HISTORY_MAX = 20;
var undoStack = [];
var redoStack = [];
function cloneTasks() { return JSON.parse(JSON.stringify(state.tasks)); }
function record(label) {
  undoStack.push({ label: label, tasks: cloneTasks() });
  if (undoStack.length > HISTORY_MAX) undoStack.shift();
  redoStack = [];
  updateHistoryButtons();
}
function updateHistoryButtons() {
  $('undoBtn').classList.toggle('off', !undoStack.length);
  $('redoBtn').classList.toggle('off', !redoStack.length);
}
function undo() { stepHistory(undoStack, redoStack, '取り消しました', '戻せる操作はありません'); }
function redo() { stepHistory(redoStack, undoStack, 'やり直しました', 'やり直せる操作はありません'); }
function stepHistory(from, to, verb, emptyMsg) {
  if (editing) return;
  if (!from.length) { toast(emptyMsg); return; }
  var entry = from.pop();
  to.push({ label: entry.label, tasks: cloneTasks() });
  var before = cloneTasks();
  entry.tasks.forEach(function (t) { t.id = realId(t.id); });
  state.tasks = entry.tasks;
  render();
  if ($('trashPanel').classList.contains('open')) renderTrash();
  updateHistoryButtons();
  toast('「' + entry.label + '」を' + verb);
  var target = JSON.parse(JSON.stringify(entry.tasks));
  enqueue(function () {
    var d = diffTasks(before, target);
    if (!d.puts.length && !d.deletes.length) return true;
    return api('apply', { puts: d.puts, deletes: d.deletes });
  });
}
/** before → after にするための書き戻し（puts）と削除（deletes）。仮IDは保存後のIDに読み替える。 */
function diffTasks(before, after) {
  var norm = function (list) {
    var m = {};
    list.forEach(function (t) { var c = JSON.parse(JSON.stringify(t)); c.id = realId(c.id); m[c.id] = c; });
    return m;
  };
  var b = norm(before), a = norm(after);
  var puts = [], deletes = [];
  Object.keys(a).forEach(function (id) {
    if (id.indexOf('tmp_') === 0) return;
    if (!b[id] || JSON.stringify(b[id]) !== JSON.stringify(a[id])) puts.push(a[id]);
  });
  Object.keys(b).forEach(function (id) {
    if (!a[id] && id.indexOf('tmp_') !== 0) deletes.push(id);
  });
  return { puts: puts, deletes: deletes };
}

function closeDetail(save) {

  var t = findTask(editing.id);
  var ed = editing;
  editing = null;
  $('detail').classList.remove('open');
  setMemoFull(false);
  if (!save || !t) return;
  var title = $('dTitle').value.replace(/\s+/g, ' ').trim();
  var patch = {};
  if (title && title !== t.title) patch.title = title;
  if (($('dDue').value || '') !== (t.due || '')) patch.due = $('dDue').value || '';
  if ($('dMemo').value !== (t.memo || '')) patch.memo = $('dMemo').value;
  if (ed.col !== t.col) {
    if (t.pinned && pinCount(ed.col, t.id) >= PIN_MAX) toast('「' + colName(ed.col) + '」はピン留めが' + PIN_MAX + 'つあるので、列は移しませんでした');
    else patch.col = ed.col;
  }
  if (!Object.keys(patch).length) return;
  record(Object.keys(patch).length === 1 && patch.col ? '移動' : '編集');
  if (patch.title) t.title = patch.title;
  if ('due' in patch) t.due = patch.due;
  if ('memo' in patch) t.memo = patch.memo;
  if (patch.col) {
    var others = activeTasks(patch.col);
    t.ord = others.length ? others.slice(-1)[0].ord + 1 : 0;
    t.col = patch.col;
  }
  render();
  if (patch.col) toast('「' + colName(patch.col) + '」へ移しました');
  enqueue(function () { return api('update', { id: realId(t.id), patch: patch }); });
}

  } catch (e) { /* 無視 */ }

function loadPlan(date) {
  if (planPending > 0) {            // 保存待ちがあるうちに読み直すと、保存前の古いシフトで上書きしてしまう
    plan.date = date;
    var c0 = storeJson(planCacheKey(date));
    if (c0 && c0.data) { plan.data = c0.data; plan.comments = c0.comments || null; }
    renderPlan();
    planQueue = planQueue.then(function () { if (plan.date === date) loadPlan(date); });
    return;
  }
  var my = ++planReq;
  plan.date = date;
  plan.error = '';
  var cached = storeJson(planCacheKey(date));
  plan.data = cached && cached.data ? cached.data : null;
  plan.comments = cached && cached.comments ? cached.comments : null;
  plan.loading = true;
  renderPlan();
  api('schedule', { date: date }).then(function (data) {
    if (my !== planReq) return;
    plan.data = data;
    plan.loading = false;
    storeJson(planCacheKey(date), { data: data, comments: plan.comments });
    renderPlan();
    if (data.sites && data.sites.length) loadComments(date, my);

    if (my !== planReq) return;
    plan.loading = false;
    plan.error = err.message;

}

// ---- 予定の書き込み：先に画面を変え、シフトへは裏で順番に保存する ----
var planQueue = Promise.resolve();
var planPending = 0;
/**
 * op を保存する。local(拠点, 訪問) で画面を先に変える（訪問が無い操作では訪問は空のもの）。
 * extra は値か、保存する直前に作る関数（元に戻すで、先の保存の結果を使うため）。
 */
function editVisit(op, site, time, client, extra, local, done) {
  var date = plan.date;
  if (local && plan.data && plan.data.date === date) {
    var sx = siteOf(site);
    if (sx) {
      var vx = findPlanVisit(date, site, client, time);
      local(sx, vx || {});
      if (vx && sx.visits.indexOf(vx) >= 0) vx.pending = true;
      afterLocalChange(date);
    }
  }
  planOp('editVisit', function () {
    var args = { op: op, date: date, site: site, time: time, client: client };
    var more = typeof extra === 'function' ? extra() : (extra || {});
    Object.keys(more).forEach(function (k) { args[k] = more[k]; });
    return args;
  }, date, function (res) { if (done) done(res); return res.schedule; });
}
function afterLocalChange(date) {
  storeJson(planCacheKey(date), { data: plan.data, comments: plan.comments });
  renderPlan();
  refreshVisit();
}
/** 保存の順番待ち。全部終わったら、シフトの最新（サーバーの返事）で描き直す */
function planOp(action, makeArgs, date, pickSchedule) {
  planPending++;
  pendingCount++;
  setStatus();
  planQueue = planQueue.then(function () {
    return api(action, makeArgs()).then(function (res) {
      var schedule = pickSchedule(res);
      planPending--;
      if (planPending === 0 && plan.date === date && schedule) {
        plan.data = schedule;
        afterLocalChange(date);
      }
    }, function (err) {
      planPending--;
      toast(err.message || '保存できませんでした');
      if (plan.date === date) loadPlan(date);
    });
  }).then(function () {
    pendingCount--;
    setStatus();
  });
}
function closeVisit() { $('visitPanel').classList.remove('open'); }

    cal.events.push(gone);
    renderCal();
    enqueue(function () { return api('addEvent', { title: gone.title, date: gone.date, time: gone.time, memo: gone.memo }); }).then(function (saved) {
      var i = cal.events.indexOf(gone);
      if (i >= 0) cal.events[i] = saved;
      renderCal();
    });
  });
}

// ---- 毎月のタスク（ひな形）：期限の10日前（期限が1〜10日なら1日）に「次に」へ自動で出る ----
function daySelect(value) {
  var sel = el('select', 'day-select');
  for (var d = 1; d <= 31; d++) { var o = el('option', null, '毎月' + d + '日'); o.value = String(d); if (d === value) o.selected = true; sel.appendChild(o); }
  return sel;
}
function monthlyInSpace() { return (state.monthly || []).filter(function (m) { return (m.space || 'work') === state.space; }); }
/** 次に「次に」へ出る日（画面の案内用。サーバーと同じ決まり） */
function nextAppearText(day) {
  var now = new Date(), today = ymd(now);
  for (var k = 0; k < 2; k++) {
    var y = now.getFullYear(), m = now.getMonth() + k;
    var last = new Date(y, m + 1, 0).getDate();
    var d = Math.min(day, last);
    var due = ymd(new Date(y, m, d)), appear = ymd(new Date(y, m, Math.max(1, d - 10)));
    if (today <= due) return today >= appear ? '今月分を「次に」に出しました' : '次は ' + fmtMd(appear) + ' に「次に」へ出ます';
  }
  return '';
}
function applyMonthlyResult(res) {
  if (res.monthly) state.monthly = res.monthly;
  (res.made || []).forEach(function (t) { if (!findTask(t.id)) state.tasks.push(t); });
  render();
  if ($('trashPanel').classList.contains('open')) renderTrash();
}
function addMonthly(title, memo, day) {
  enqueue(function () { return api('addMonthly', { title: title, memo: memo, day: day, space: state.space }); }).then(function (res) {
    applyMonthlyResult(res);
    toast('毎月' + day + '日のタスクにしました。' + nextAppearText(day));
  });
}
function renderDetailMonthly(t) {
  var box = $('dMonthly');
  box.innerHTML = '';
  var tplId = t.tpl ? t.tpl.split(':')[0] : '';
  var tpl = (state.monthly || []).filter(function (m) { return m.id === tplId; })[0];
  if (tpl) {
    var sel = daySelect(tpl.day);
    sel.onchange = function () {
      var day = Number(sel.value);
      enqueue(function () { return api('updateMonthly', { id: tpl.id, patch: { day: day } }); }).then(function (res) {
        applyMonthlyResult(res);
        toast('来月から毎月' + day + '日にします');
      });
    };
    box.appendChild(sel);
    var stop = el('button', 'small-btn del', '毎月をやめる');
    stop.onclick = function () {
      if (!stop.classList.contains('armed')) { stop.classList.add('armed'); stop.textContent = 'もう一度押すとやめる'; return; }
      stopMonthly(tpl.id);
      box.innerHTML = '';
      box.appendChild(el('span', 'note', '毎月をやめました（このカードは残ります）'));
    };
    box.appendChild(stop);
    return;
  }
  if (t.tpl) { box.appendChild(el('span', 'note', '毎月はやめています')); return; }
  var make = el('button', 'small-btn', '🔁 毎月にする');
  make.onclick = function () {
    box.innerHTML = '';
    var d0 = t.due ? Number(t.due.slice(8)) : new Date().getDate();
    var sel2 = daySelect(d0);
    var go = el('button', 'small-btn', '決定');
    go.onclick = function () {
      var day = Number(sel2.value);
      var id = editing ? editing.id : t.id;
      enqueue(function () { return api('makeMonthly', { taskId: realId(id), day: day }); }).then(function (res) {
        var cur = findTask(res.task.id);
        if (cur) { cur.tpl = res.task.tpl; cur.due = res.task.due; }
        applyMonthlyResult(res);
        if (editing && cur && editing.id === cur.id) { $('dDue').value = cur.due || ''; renderDetailMonthly(cur); }
        toast('毎月' + day + '日のタスクにしました');
      });
    };
    box.appendChild(sel2);
    box.appendChild(go);
  };
  box.appendChild(make);
}
function stopMonthly(id) {
  state.monthly = (state.monthly || []).filter(function (m) { return m.id !== id; });
  if ($('trashPanel').classList.contains('open')) renderTrash();
  enqueue(function () { return api('deleteMonthly', { id: id }); }).then(applyMonthlyResult);
  toast('毎月をやめました');
}
function renderMonthlyList() {
  var sec = $('monthlySec');
  sec.innerHTML = '';
  var list = monthlyInSpace().slice().sort(function (a, b) { return a.day - b.day; });
  sec.appendChild(el('h4', null, '🔁 毎月のタスク'));
  sec.appendChild(el('div', 'note', '期限の10日前（期限が1〜10日のものは1日）に「次に」へ出ます。完了・削除しても翌月また出ます。'));
  if (!list.length) { sec.appendChild(el('div', 'note', 'まだありません（PCの下の入力欄で「毎月」を選ぶか、カードを開いて「🔁 毎月にする」）')); return; }
  list.forEach(function (m) {
    var row = el('div', 'monthly-row');
    var sel = daySelect(m.day);
    sel.onchange = function () {
      var day = Number(sel.value);
      enqueue(function () { return api('updateMonthly', { id: m.id, patch: { day: day } }); }).then(function (res) { applyMonthlyResult(res); toast('来月から毎月' + day + '日にします'); });
    };
    var name = el('input');
    name.value = m.title;
    name.maxLength = 200;
    name.onchange = function () {
      var title = name.value.replace(/\s+/g, ' ').trim();
      if (!title) { name.value = m.title; return; }
      enqueue(function () { return api('updateMonthly', { id: m.id, patch: { title: title } }); }).then(function (res) { applyMonthlyResult(res); toast('名前を直しました（来月の分から）'); });
    };
    var stop = el('button', 'small-btn del', 'やめる');
    stop.onclick = function () {
      if (!stop.classList.contains('armed')) { stop.classList.add('armed'); stop.textContent = 'もう一度'; return; }
      stopMonthly(m.id);
    };
    row.appendChild(sel);
    row.appendChild(name);
    row.appendChild(stop);
    sec.appendChild(row);
  });
}

// ---- PCだけ：画面の下に固定した入力欄（Enterで続けて追加。入れる列は最後に選んだものを覚える） ----
var quickCol = store('mt_quick_col') || 'now';
var quickDay = Number(store('mt_quick_day')) || 1;
function renderQuickCols() {
  if (COLS.map(function (c) { return c.id; }).concat(['monthly']).indexOf(quickCol) < 0) quickCol = 'now';
  var box = $('quickCols');
  box.innerHTML = '';
  COLS.concat([{ id: 'monthly', short: '毎月' }]).forEach(function (c) {
    var b = el('button', c.id === quickCol ? 'on' : '', c.short);
    b.type = 'button';
    b.dataset.col = c.id === 'monthly' ? 'next' : c.id;
    b.onclick = function () { quickCol = c.id; store('mt_quick_col', c.id); renderQuickCols(); $('quickInput').focus(); };
    box.appendChild(b);
  });
  if (quickCol === 'monthly') {
    var sel = daySelect(quickDay);
    sel.onchange = function () { quickDay = Number(sel.value); store('mt_quick_day', String(quickDay)); };
    box.appendChild(sel);
  }
}
function submitQuick() {
  var inp = $('quickInput'), memo = $('quickMemo');
  var title = inp.value.replace(/\s+/g, ' ').trim();
  if (!title) { inp.focus(); return; }
  var text = memo.value.replace(/\s+$/, '');
  inp.value = '';
  memo.value = '';
  if (quickCol === 'monthly') addMonthly(title, text, quickDay);
  else addTask(quickCol, title, true, text);
  inp.focus();
}
$('quickAdd').onsubmit = function (e) { e.preventDefault(); submitQuick(); };
$('quickMemo').onkeydown = function (e) {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); submitQuick(); }
};

// ---- つなぎ込み ----
$('addTop').onclick = function () { openAdd(mobileMq.matches && state.active !== 'plan' ? state.active : 'now'); };
$('titleBtn').onclick = function () { setSpace(state.space === 'private' ? 'work' : 'private'); };
$('trashBtn').onclick = openTrash;
$('mLogout').onclick = function () { closeTrash(); logout(); };
$('trashClose').onclick = closeTrash;
$('evClose').onclick = closeEvent;
$('eventPanel').onclick = function (e) { if (e.target === this) closeEvent(); };
$('evSave').onclick = saveEvent;
$('evDel').onclick = deleteEvent;
$('evTimeClear').onclick = function () { $('evTime').value = ''; };
$('evTitle').onkeydown = function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveEvent(); } };
$('trashAll').onclick = function () {
  var b = $('trashAll');
  if (!b.classList.contains('armed')) {
    b.classList.add('armed');
    b.textContent = 'もう一度押すと' + trashTasks().length + '件すべて削除';
    return;
  }
  purgeAllTrash();
};
$('trashPanel').onclick = function (e) { if (e.target === this) closeTrash(); };
$('vClose').onclick = closeVisit;
$('vCloseBottom').onclick = closeVisit;
$('visitPanel').onclick = function (e) { if (e.target === this) closeVisit(); };
$('dClose').onclick = function () { closeDetail(true); };
$('detail').onclick = function (e) { if (e.target === this) closeDetail(true); };
$('dTitle').oninput = function () { autoGrow(this); };
$('dTitle').onkeydown = function (e) { if (e.key === 'Enter') e.preventDefault(); };
$('dMemo').oninput = updateCounter;
$('dMemoFull').onclick = function () { setMemoFull(!$('detail').classList.contains('memo-full')); };
$('dMemo').addEventListener('click', editMemoFull);
$('dDueClear').onclick = function () { $('dDue').value = ''; };
$('dCloseBottom').onclick = function () { closeDetail(true); };
$('dPin').onclick = function () { if (editing) togglePin(editing.id); };
$('dDel').onclick = function () {
  var b = $('dDel');
  var cur = editing && findTask(editing.id);
  if (cur && cur.pinned) { toast('ピンを外すと削除できます'); return; }
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'もう一度押すと削除'; return; }
  var id = editing.id;
  closeDetail(false);
  deleteTask(id);
};
$('undoBtn').onclick = undo;
$('redoBtn').onclick = redo;
document.addEventListener('keydown', function (e) {
  if (!(e.metaKey || e.ctrlKey) || editing) return;
  var tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  var k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if ($('detail').classList.contains('memo-full')) { setMemoFull(false); return; }
  if ($('detail').classList.contains('open')) closeDetail(true);
  closeTrash();
  closeVisit();
  closeEvent();
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !started || !store('mt_token')) return;
  if (pendingCount === 0 && !editing) load();
  if (plan.date && (state.active === 'plan' || !mobileMq.matches)) loadPlan(plan.date);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () { /* 無くても動く */ });
}

state.active = store('mt_active') || 'now';
state.space = store('mt_space') === 'private' ? 'private' : 'work';
applySpaceLook();
if (currentTabs().map(function (c) { return c.id; }).indexOf(state.active) < 0) state.active = 'now';
state.me = storeJson('mt_me');
state.monthly = storeJson('mt_monthly') || [];
if (store('mt_token')) startApp(); else showLogin();
</script>
